name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "24"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stipend
          POSTGRES_PASSWORD: stipend
          POSTGRES_DB: stipend
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://stipend:stipend@localhost:5432/stipend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: node server/db/migrate.js

      - name: Unit and API tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stipend
          POSTGRES_PASSWORD: stipend
          POSTGRES_DB: stipend_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://stipend:stipend@localhost:5432/stipend_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: End-to-end tests
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:e2e

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only; publishing is left to the release workflow so a pull request from a
      # fork can never push an image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: stipend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
