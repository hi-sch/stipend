apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stipend.fullname" . }}
  labels:
    {{- include "stipend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "stipend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stipend.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "stipend.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Give an evicted pod time to finish the authorizations already in flight.
      terminationGracePeriodSeconds: 30
      initContainers:
        # Migrations take a Postgres advisory lock, so several pods rolling out together
        # queue rather than racing to apply the same file.
        - name: migrate
          image: "{{ required "image.repository is required, e.g. ghcr.io/your-org/stipend" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "server/db/migrate.js"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "stipend.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: stipend
          image: "{{ required "image.repository is required, e.g. ghcr.io/your-org/stipend" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- include "stipend.env" . | nindent 12 }}
            - name: LITHIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.lithicSecretName is required" .Values.secrets.lithicSecretName }}
                  key: LITHIC_API_KEY
            {{- if .Values.secrets.smtpSecretName }}
            - name: SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.smtpSecretName }}
                  key: SMTP_URL
            {{- end }}
          # Liveness only asks whether the process still serves. It deliberately does not
          # check the database: restarting a pod does not fix a database outage, it just
          # removes capacity during one.
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness does check the database, so a pod that cannot reach Postgres leaves
          # the Service instead of answering with errors.
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 3
            failureThreshold: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so anything that writes needs an explicit mount.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
